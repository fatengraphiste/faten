  const cr=mk('rect',{x:-CW/2+140,y:-60,width:0,height:120},cp);
  const fill=mk('rect',{x:-CW/2,y:-CH/2,width:CW,height:CH,rx:CR,fill:c.primary?RED:'#fff','fill-opacity':0},g);
  const pulse=mk('rect',Object.assign({x:-CW/2,y:-CH/2,width:CW,height:CH,rx:CR,fill:'none',stroke:RED,'stroke-width':5,opacity:0}),g);
  const out=mk('rect',Object.assign({x:-CW/2,y:-CH/2,width:CW,height:CH,rx:CR,fill:'none',stroke:c.primary?'#fff':RED,'stroke-width':c.primary?0:6},DASH),g);
  const ix=-CW/2+CR;
  const ig=mk('g',{transform:`translate(${ix},0)`},g);
  const ripple=mk('circle',{r:50,fill:'none',stroke:c.primary?'#fff':RED,'stroke-width':4,opacity:0},ig);
  const disc=mk('circle',{r:50,fill:c.primary?'#fff':RED},ig);
  const gl=mk('g',{transform:'scale(2.2) translate(-12,-12)'},ig);
  const paths=ICON[c.key].map(d=>mk('path',Object.assign({d,fill:'none',stroke:c.primary?RED:'#fff','stroke-width':1.8,'stroke-linecap':'round','stroke-linejoin':'round'},DASH),gl));
  const lab=mk('text',{x:-CW/2+140,y:-26,'font-size':21,'font-weight':700,'letter-spacing':4,'fill-opacity':.62,'dominant-baseline':'central','clip-path':`url(#cc${i})`},g);lab.textContent=c.label;
  const val=mk('text',{x:-CW/2+140,y:16,'font-size':c.val.length>18?41:44,'font-weight':800,'dominant-baseline':'central','clip-path':`url(#cc${i})`},g);val.textContent=c.val;
  return {g,cr,fill,pulse,out,ig,ripple,disc,paths,primary:c.primary,y:c.y};
});

/* ---- timeline ---- */
window.DUR=5;
function render(tReal){
  const t=tReal/(window.DUR/5);
  /* camera push-in */
  const z=1;
  $('cam').setAttribute('transform',`translate(540,960) scale(${z}) translate(-540,-960)`);
  /* grid */
  gridLines.forEach(g=>{const s=0.15+g.dist/1400;g.e.setAttribute('stroke-dashoffset',1-eo(seg(t,s,s+0.7)));});
  /* rings */
  rings.forEach(r=>{const p=seg(t,r.t0,r.t0+1.0);const e=eo(p);
    r.e.setAttribute('r',20+e*1400);r.e.setAttribute('opacity',p>0&&p<1?0.85*(1-p):0);});
  /* corners */
  cornerPaths.forEach((c,i)=>c.setAttribute('stroke-dashoffset',1-eo(seg(t,0.15+i*0.1,0.9+i*0.1))));
  /* particles */
  const fadeIn=seg(t,0.2,1.2);
  parts.forEach(p=>{
    const y=((p.y0-p.sp*tReal*(5/window.DUR))%1960+1960)%1960-20;
    p.e.setAttribute('cx',p.x+Math.sin(tReal*2+p.ph)*p.dx);p.e.setAttribute('cy',y);
    p.e.setAttribute('opacity',fadeIn*p.op*(0.6+0.4*Math.sin(tReal*5+p.ph)));
  });
  floaters.forEach(f=>{
    const y=((f.y0-f.sp*t)%2000+2000)%2000-40;
    f.g.setAttribute('transform',`translate(${f.x},${y}) rotate(${f.rot+t*8}) scale(${f.sc}) translate(-12,-12)`);
    f.g.setAttribute('opacity',fadeIn*f.op);
  });
  /* logo draw */
  const dw=seg(t,0.25,1.65);
  strokes.forEach((s,i)=>{const [a,b]=STAG[i];s.setAttribute('stroke-dashoffset',1-eio(clamp((dw-a)/b)));});
  const fi=eo(seg(t,1.4,1.95));
  fills.forEach(f=>f.setAttribute('opacity',fi));
  $('logoStroke').setAttribute('opacity',1-0.65*seg(t,1.6,2.2));
  /* logo move */
  const mv=eio(seg(t,2.15,2.75));
  const pop=1+0.07*Math.sin(Math.PI*seg(t,1.45,1.95))*(1-seg(t,1.95,1.95));
  const sc=(0.8+(0.7-0.8)*mv)*(1+0.04*Math.sin(Math.PI*seg(t,1.4,1.9)));
  const cy=960+(560-960)*mv;
  $('logo').setAttribute('transform',`translate(540,${cy}) scale(${sc}) translate(${-lw/2},${-lh/2})`);
  $('glow').setAttribute('cy',cy);
  
  
  /* red light sweeps over logo (twice) */
  const s1=seg(t,1.9,2.5), s2=seg(t,4.2,4.8);
  const sw=s1>0&&s1<1?eio(s1):(s2>0?eio(s2):0);
  $('shine').setAttribute('x',-250+sw*1300);
  $('shine').setAttribute('opacity',(s1>0&&s1<1)||(s2>0&&s2<1)?1:0);
  /* flash */
  const fp=seg(t,1.45,1.8);
  $('flash').setAttribute('opacity',fp>0&&fp<1?0:0);
  /* wipe */
  const wp=seg(t,2.0,2.75);
  const wx=-1500+eio(wp)*3000;
  $('wipe').setAttribute('transform',`translate(540,960) rotate(-18) translate(${wx},0)`);
  $('wipe').setAttribute('opacity',wp>0&&wp<1?1:0);
  /* tagline */
  const tg=eo(seg(t,2.45,3.05));
  $('tagClipR').setAttribute('x',-380*tg);$('tagClipR').setAttribute('width',760*tg);
  $('tagLine').setAttribute('stroke-dashoffset',1-eio(seg(t,2.6,3.2)));
  $('sqL').setAttribute('opacity',seg(t,2.9,3.15));$('sqR').setAttribute('opacity',seg(t,2.9,3.15));
  $('tag').setAttribute('transform',`translate(540,${752+18*(1-tg)})`);
  /* cards */
  cardEls.forEach((c,i)=>{
    const s=2.55+i*0.24;
    const a=seg(t,s,s+0.3);
    const slide=1-eob(seg(t,s,s+0.65));
    c.g.setAttribute('opacity',a);
    c.g.setAttribute('transform',`translate(540,${c.y+100*slide})`);
    c.out.setAttribute('stroke-dashoffset',1-eio(seg(t,s,s+0.6)));
    c.fill.setAttribute('fill-opacity',(c.primary?1:0.09)*eo(seg(t,s+0.35,s+0.8)));
    const pop=eob(seg(t,s+0.3,s+0.85));
    c.ig.setAttribute('transform',`translate(${-CW/2+CR},0) scale(${pop})`);
    const rp=seg(t,s+0.55,s+1.15);
    c.ripple.setAttribute('r',50+40*eo(rp));c.ripple.setAttribute('opacity',rp>0&&rp<1?0.8*(1-rp):0);
    c.paths.forEach(p=>p.setAttribute('stroke-dashoffset',1-eio(seg(t,s+0.4,s+0.95))));
    c.cr.setAttribute('width',600*eo(seg(t,s+0.45,s+1.0)));
    /* idle pulse on whatsapp */
    if(c.primary){
      const q=((tReal*(5/window.DUR)-3.7)/0.9);
      if(q>0){const ph=q%1;
        c.pulse.setAttribute('transform',`scale(${1+0.06*eo(ph)},${1+0.2*eo(ph)})`);
        c.pulse.setAttribute('opacity',0.7*(1-ph));}
    }
  });
}
window.render=render;
render(0);
</script>
</body></html>
