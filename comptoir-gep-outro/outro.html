// ---- timeline ----
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eob=x=>{const c1=1.4,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};

window.DUR=5; // seconds (overridden by ?d=3)
function render(tReal){
  const k=window.DUR/5;          // time scale (3s version compresses)
  const t=tReal/k;                // timeline in "5s units"
  // deco corners
  const d1=eo(seg(t,0.1,1.0));
  document.getElementById('deco1').setAttribute('stroke-dasharray','1 1.02');
  document.getElementById('deco1').setAttribute('stroke-dashoffset',1-d1);
  document.getElementById('deco2').setAttribute('stroke-dasharray','1 1.02');
  document.getElementById('deco2').setAttribute('stroke-dashoffset',1-d1);
  // logo draw 0.2 -> 1.9
  const dw=seg(t,0.2,1.9);
  strokes.forEach((s,i)=>{
    const [a,b]=STAG[i];
    const p=eio(clamp((dw-a)/b));
    s.setAttribute('stroke-dashoffset',1-p);
  });
  // fill-in 1.55 -> 2.2 ; stroke fades
  const fi=eo(seg(t,1.55,2.2));
  fills.forEach(f=>f.setAttribute('opacity',fi));
  const strokeFade=1-seg(t,2.0,2.5)*0.0; // keep stroke (white outline blends w/ fill)
  // logo transform: centre big -> up/small
  const lw=1013.44,lh=238.97;
  const mv=eio(seg(t,2.2,3.0));
  const sc0=1.05,sc1=0.78;
  const sc=sc0+(sc1-sc0)*mv;
  const cx=960,cy0=540,cy1=285;
  const cy=cy0+(cy1-cy0)*mv;
  // subtle pop on fill
  const pop=1+0.02*Math.sin(Math.PI*seg(t,1.7,2.3));
  document.getElementById('logo').setAttribute('transform',
    `translate(${cx},${cy}) scale(${sc*pop}) translate(${-lw/2},${-lh/2})`);
  // frame draw 2.8 -> 3.7
  const fp=eio(seg(t,2.75,3.6));
  ['fTop','fBot'].forEach(id=>{
    const e=document.getElementById(id);
    e.setAttribute('stroke-dasharray','1 1.02');
    e.setAttribute('stroke-dashoffset',1-fp);
  });
  nubs.forEach(n=>n.setAttribute('opacity',seg(t,3.3,3.6)));
  // rows
  rowEls.forEach((r,i)=>{
    const s=3.15+i*0.28;
    const ringP=eio(seg(t,s,s+0.5));
    r.ring.setAttribute('stroke-dashoffset',1-ringP);
    const glP=eio(seg(t,s+0.25,s+0.75));
    r.gl.forEach(g=>g.setAttribute('stroke-dashoffset',1-glP));
    const tp=eo(seg(t,s+0.3,s+0.85));
    r.cr.setAttribute('width',(r.w+14)*tp);
  });
  // gentle final settle: tiny breathing glow none; fade-in handled
}
window.render=render;
render(0);
</script>
