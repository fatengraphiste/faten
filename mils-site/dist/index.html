<head>

<title>Proposition CCA pour MILS · accès réservé</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#F1EFEA;--ink:#14161A;--dim:rgba(20,22,26,.55);--faint:rgba(20,22,26,.28);--line:rgba(20,22,26,.1);--orange:#F26B1D;--orange-2:#FF9A3D;--blue:#1F5FBF;--green:#1E9E63;
  --grad:linear-gradient(100deg,var(--orange),var(--orange-2) 45%,var(--blue));--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--out:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:"Inter","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:24px 16px;overflow:hidden}
.guides{position:fixed;inset:0;pointer-events:none}
.guides i{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.guides i:nth-child(1){left:17%}.guides i:nth-child(2){left:50%}.guides i:nth-child(3){left:83%}
.mono{font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.gate{position:relative;width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center;animation:in .9s var(--out) both}
@keyframes in{from{opacity:0;transform:translateY(20px)}}
.logos{display:flex;align-items:center;gap:18px;transition:gap .8s var(--out),opacity .8s}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:18px;letter-spacing:-.02em;transition:transform .8s var(--out)}
.logo b{width:22px;height:22px;border-radius:6px;background:var(--grad)}
.logo img{height:26px;width:auto}
.logos .x{color:var(--faint)}
.lock{width:64px;height:76px}
.lock .shackle{transition:transform .5s cubic-bezier(.34,1.56,.64,1);transform-origin:44px 30px}
.open .lock .shackle{transform:translate(0,-8px) rotate(28deg)}
.open .lock .body{fill:var(--green)}
.open .logo:first-child{transform:translateX(-60px)}
.open .logo:last-child{transform:translateX(60px)}
.open .logos{opacity:0}
.lock .body{fill:var(--ink);transition:fill .3s}
h1{font-weight:400;font-size:clamp(26px,4vw,34px);letter-spacing:-.03em;line-height:1.15}
h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
form{width:100%;display:flex;flex-direction:column;gap:10px}
.field{display:flex;border:1px solid var(--ink);background:#fff;height:52px}
.field input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:0 16px;font:500 16px var(--mono);letter-spacing:.08em}
.field button{width:52px;border:0;background:var(--ink);color:#fff;font-size:18px;cursor:pointer;display:grid;place-items:center}
.field:focus-within{outline:2px solid var(--orange);outline-offset:3px}
.field.err{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
.msg{min-height:16px;color:var(--dim)}
.msg.bad{color:#C0392B}
.busy .field button{opacity:.5}
footer{position:fixed;bottom:18px;left:0;right:0;text-align:center;color:var(--dim)}
noscript{display:block;margin-top:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="guides" aria-hidden="true"><i></i><i></i><i></i></div>
<main class="gate" id="gate">
  <div class="logos" aria-label="CCA et CCA Salesfactory">
    <span class="logo"><b aria-hidden="true"></b>CCA</span><span class="x">×</span><span class="logo">Salesfactory</span>
  </div>
  <svg class="lock" viewBox="0 0 64 76" aria-hidden="true">
    <path class="shackle" d="M16 32V22a16 16 0 0 1 32 0v10" fill="none" stroke="#14161A" stroke-width="5" stroke-linecap="round"/>
    <rect class="body" x="6" y="32" width="52" height="40" rx="8"/>
    <circle cx="32" cy="50" r="5" fill="#F1EFEA"/><rect x="30" y="52" width="4" height="9" rx="2" fill="#F1EFEA"/>
  </svg>
  <div>
    <p class="mono" style="color:var(--dim);margin-bottom:10px">Accès réservé</p>
    <h1>Proposition CCA <span>pour MILS</span></h1>
  </div>
  <form id="f" autocomplete="off">
    <label class="mono" for="pw" style="text-align:left;color:var(--dim)">Mot de passe</label>
    <div class="field" id="field"><input id="pw" type="password" required autocomplete="current-password" autofocus spellcheck="false"><button type="submit" aria-label="Entrer">→</button></div>
    <p class="msg mono" id="msg" role="status" aria-live="polite">Le mot de passe figure dans l'email de remise de l'offre.</p>
  </form>
  <noscript class="mono">JavaScript est nécessaire pour ouvrir ce document.</noscript>
</main>

const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const f=document.getElementById('f'),pw=document.getElementById('pw'),msg=document.getElementById('msg'),field=document.getElementById('field'),gate=document.getElementById('gate');
let fails=0,busy=false;
async function open(pass){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(P.i)},key,u8(P.d)));
}
f.addEventListener('submit',async e=>{
  e.preventDefault(); if(busy||!pw.value) return; busy=true; gate.classList.add('busy'); msg.className='msg mono'; msg.textContent='Vérification…';
  try{
    const html=await open(pw.value); pw.value='';
    msg.textContent='Accès autorisé'; gate.classList.add('open');
    await new Promise(r=>setTimeout(r,RM?0:850));
    document.open(); document.write(html); document.close();
  }catch(err){
    fails++; field.classList.remove('err'); void field.offsetWidth; field.classList.add('err');
    msg.className='msg mono bad'; msg.textContent='Mot de passe incorrect';
    await new Promise(r=>setTimeout(r,Math.min(8000,400*2**fails)));
    busy=false; gate.classList.remove('busy'); pw.select();
  }
});
})();
