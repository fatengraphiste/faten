<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>Proposition CCA pour MILS · accès réservé</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#000;--ink:#fff;--dim:rgba(255,255,255,.5);--faint:rgba(255,255,255,.22);--line:rgba(255,255,255,.08);--orange:#EF791F;--blue:#0058A5;--green:#2FBF7A;
  --grad:linear-gradient(100deg,var(--orange),#3F8FE0);--mono:"Poppins",system-ui,sans-serif;--out:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:"Source Sans 3","Source Sans Pro",system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:24px 20px;overflow-x:hidden}
.guides{position:fixed;inset:0;pointer-events:none}
.guides i{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.guides i:nth-child(1){left:17%}.guides i:nth-child(2){left:50%}.guides i:nth-child(3){left:83%}
.mono{font-family:var(--mono);font-weight:500;text-transform:uppercase;letter-spacing:.12em;font-size:11px}
body:before{content:"";position:fixed;left:50%;top:42%;width:min(70vw,620px);aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(239,121,31,.16),rgba(0,88,165,.08) 60%,transparent);pointer-events:none}
.gate{position:relative;width:100%;min-width:0;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center;animation:in .9s var(--out) both}
@keyframes in{from{opacity:0;transform:translateY(20px)}}
.logos{display:flex;align-items:center;gap:18px;transition:gap .8s var(--out),opacity .8s}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-weight:500;font-size:17px;letter-spacing:-.01em;transition:transform .8s var(--out)}
.logo svg{height:34px;width:auto}
.logo.sf svg{height:30px}
.logo img{height:26px;width:auto}
.logos .x{color:var(--faint)}
.lock{width:64px;height:76px}
.lock .shackle{transition:transform .5s cubic-bezier(.34,1.56,.64,1);transform-origin:44px 30px}
.open .lock .shackle{transform:translate(0,-8px) rotate(28deg)}
.open .lock .body{fill:var(--green)}
.open .logo:first-child{transform:translateX(-60px)}
.open .logo:last-child{transform:translateX(60px)}
.open .logos{opacity:0}
.lock .body{fill:var(--orange);transition:fill .3s}
h1{font-family:var(--mono);font-weight:500;font-size:clamp(26px,4vw,34px);letter-spacing:-.03em;line-height:1.15}
h1 span{color:var(--orange)}
form{width:100%;display:flex;flex-direction:column;gap:10px}
.field{display:flex;border:1px solid var(--faint);border-radius:999px;background:#0B0C0E;height:54px;overflow:hidden;padding:4px}
.field input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:0 18px;color:#fff;font:500 16px var(--mono);letter-spacing:.08em}
.field .eye{flex:none;width:44px;border:0;background:transparent;color:var(--dim);cursor:pointer;display:grid;place-items:center}
.field .eye svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.field .eye:hover,.field .eye.on{color:#fff}
.field button[type=submit]{flex:none;width:46px;border:0;border-radius:50%;background:var(--orange);color:#fff;font-size:18px;cursor:pointer;display:grid;place-items:center}
.field:focus-within{border-color:var(--orange)}
.field.err{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
.msg{min-height:16px;color:var(--dim);line-height:1.6}
.field .eye.on .slash{display:none}
h1{overflow-wrap:break-word}
@media (max-width:480px){.gate{gap:20px}.logo svg{height:28px}.logo.sf svg{height:24px}.mono{letter-spacing:.08em}}
.msg.bad{color:#FF5A4E}
.busy .field button{opacity:.5}
footer{position:fixed;bottom:18px;left:0;right:0;text-align:center;color:var(--dim)}
noscript{display:block;margin-top:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="gate" id="gate">
  <div class="logos" aria-label="CCA et CCA Salesfactory">
    <span class="logo"><!--__LOGO__--></span><span class="x">×</span><span class="logo sf"><!--__SF_LOGO__--></span>
  </div>
  <svg class="lock" viewBox="0 0 64 76" aria-hidden="true">
    <path class="shackle" d="M16 32V22a16 16 0 0 1 32 0v10" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <rect class="body" x="6" y="32" width="52" height="40" rx="8"/>
    <circle cx="32" cy="50" r="5" fill="#000"/><rect x="30" y="52" width="4" height="9" rx="2" fill="#000"/>
  </svg>
  <div>
    <p class="mono" style="color:var(--dim);margin-bottom:10px">Accès réservé</p>
    <h1>Proposition CCA <span>pour MILS</span></h1>
  </div>
  <form id="f" autocomplete="off">
    <label class="mono" for="pw" style="text-align:left;color:var(--dim)">Mot de passe</label>
    <div class="field" id="field"><input id="pw" type="password" required autocomplete="current-password" autofocus spellcheck="false"><button type="button" class="eye" id="eye" aria-label="Afficher le mot de passe" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16"/></svg></button><button type="submit" aria-label="Entrer"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button></div>
    <p class="msg mono" id="msg" role="status" aria-live="polite">Le mot de passe figure dans l'email de remise de l'offre.</p>
  </form>
  <noscript class="mono">JavaScript est nécessaire pour ouvrir ce document.</noscript>
</main>
<footer class="mono">Document confidentiel · CCA</footer>
<script>
(()=>{
"use strict";
const P=__PAYLOAD__;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const f=document.getElementById('f'),pw=document.getElementById('pw'),msg=document.getElementById('msg'),field=document.getElementById('field'),gate=document.getElementById('gate');
let fails=0,busy=false;
// œil : afficher ou masquer le mot de passe
document.getElementById('eye').addEventListener('click',e=>{ const b=e.currentTarget, show=pw.type==='password'; pw.type=show?'text':'password'; b.classList.toggle('on',show); b.setAttribute('aria-pressed',show); b.setAttribute('aria-label',show?'Masquer le mot de passe':'Afficher le mot de passe'); pw.focus(); });
// compteur de connexions (track.php, sur le même hébergement)
const track=type=>{ try{ const d=JSON.stringify({type}); if(!navigator.sendBeacon||!navigator.sendBeacon('track.php',new Blob([d],{type:'application/json'}))) fetch('track.php',{method:'POST',body:d,keepalive:true}); }catch(e){} };
async function open(pass){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(P.i)},key,u8(P.d));
  return await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}
f.addEventListener('submit',async e=>{
  e.preventDefault(); if(busy||!pw.value) return; busy=true; gate.classList.add('busy'); msg.className='msg mono'; msg.textContent='Vérification…';
  try{
    const html=await open(pw.value); pw.value=''; track('connexion');
    msg.textContent='Accès autorisé'; gate.classList.add('open');
    await new Promise(r=>setTimeout(r,RM?0:850));
    document.open(); document.write(html); document.close();
  }catch(err){
    fails++; track('echec'); field.classList.remove('err'); void field.offsetWidth; field.classList.add('err');
    msg.className='msg mono bad'; msg.textContent='Mot de passe incorrect';
    await new Promise(r=>setTimeout(r,Math.min(8000,400*2**fails)));
    busy=false; gate.classList.remove('busy'); pw.select();
  }
});
})();
</script>
</body>
</html>
