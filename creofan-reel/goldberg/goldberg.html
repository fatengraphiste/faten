<script>
"use strict";
/* =====================================================================
   ZERO MANUAL KEYFRAMES — une bille, une trajectoire continue.
   La position de la bille est une fonction physique de t (gravité,
   roulement accéléré, boucle, engrenage à cliquet). Tout le reste
   (texte, caméra, son) est déclenché par la bille.
   Monde périodique : la fin du cycle (chute depuis le point du logo)
   rejoint exactement le début du cycle suivant → boucle parfaite.
   126 BPM · 15 s · 60 i/s · window.seek(t)
   ===================================================================== */
const W = 1080, H = 1920, DUR = 15, BPM = 126, BEAT = 60 / BPM;
const RED = "#f7322a", BEIGE = "#fff5f5", WHITE = "#ffffff", CHAR = "#111111";
const SAFE = { left: 70, right: W - 120, top: 250, bottom: H - 250 };
const CX = (SAFE.left + SAFE.right) / 2; // 515
const G = 1800;     // gravité (px/s²)
const BR = 26;      // rayon de la bille
const cv = document.getElementById("c"), ctx = cv.getContext("2d");

/* ---------- Mathématiques ---------- */
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp01((t - a) / (b - a));
const outExpo = (k) => (k >= 1 ? 1 : 1 - Math.pow(2, -10 * k));
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  return (x) => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let u = x;
    for (let i = 0; i < 8; i++) { const e = ((ax * u + bx) * u + cx) * u - x, d = (3 * ax * u + 2 * bx) * u + cx; if (Math.abs(e) < 1e-6 || !d) break; u -= e / d; }
    u = clamp01(u); return ((ay * u + by) * u + cy) * u;
  };
}
const snapE = bezier(0.85, 0, 0.12, 1);
const roll = (u) => 0.55 * u + 0.45 * u * u;             // roulement qui accélère
const cubic = (p0, p1, p2, p3, u) => {
  const v = 1 - u;
  return [v * v * v * p0[0] + 3 * v * v * u * p1[0] + 3 * v * u * u * p2[0] + u * u * u * p3[0],
          v * v * v * p0[1] + 3 * v * v * u * p1[1] + 3 * v * u * u * p2[1] + u * u * u * p3[1]];
};

/* ---------- Géométrie du parcours (coordonnées monde) ---------- */
const LOGO = { w: 600, top: 4790 };
LOGO.h = LOGO.w * 551 / 900;
const DOT = { x: CX - LOGO.w / 2 + 0.9266 * LOGO.w, y: LOGO.top + 0.6955 * LOGO.h, r: 0.0204 * LOGO.w };
const FALL = 1.0;                                  // chute finale depuis le point du logo
const V0 = G * FALL;                               // vitesse à l'apparition = vitesse en fin de chute
const SPAWN = { x: 540, y: 300 };
const PERIOD = DOT.y + 0.5 * G * FALL * FALL - SPAWN.y; // décalage vertical entre deux cycles

const GEAR = { x: 560, y: 3920, r: 240, ride: 270 };
const GEAR_START = -150, GEAR_STEP = 34.2857, GEAR_T0 = 7.62;
const POCKET = { x: CX, y: 4330 };
const FLAPS = [
  { x: 500, hit: 4.76, word: "Text" },
  { x: 610, hit: 5.24, word: "Animation" },
  { x: 720, hit: 5.71, word: "Transition" },
  { x: 830, hit: 6.19, word: "Effet sonores" },
];
const TRACK_Y = 2520, BADGE = { x: 500, y: 2790, s: 150, pass: 6.775 };
const S1END = SPAWN.y + V0 * 0.25 + 0.5 * G * 0.0625;

// Segments : [t0, t1, contact (roule sur un rail ?), fonction u → [x, y]]
const SEGS = [
  [0, 0.25, false, (u) => { const s = u * 0.25; return [SPAWN.x, SPAWN.y + V0 * s + 0.5 * G * s * s]; }],
  [0.25, 0.85, true, (u) => { const k = roll(u); return [lerp(540, 840, k), lerp(S1END, S1END + 154, k)]; }],
  [0.85, 1.10, true, (u) => { const a = (-90 + 180 * u) * Math.PI / 180; return [840 + 85 * Math.cos(a), S1END + 239 + 85 * Math.sin(a)]; }],
  [1.10, 1.68, true, (u) => { const k = roll(u); return [lerp(840, 230, k), lerp(S1END + 324, S1END + 504, k)]; }],
  [1.68, 1.93, true, (u) => { const a = (-90 - 180 * u) * Math.PI / 180; return [230 + 85 * Math.cos(a), S1END + 589 + 85 * Math.sin(a)]; }],
  [1.93, 2.50, true, (u) => { const k = roll(u); return [lerp(230, 790, k), lerp(S1END + 674, S1END + 844, k)]; }],

function gearAngle(t) {

function ballPos(t) { const k = Math.floor(t / DUR); const p = rawPos(t - k * DUR); return [p[0], p[1] + k * PERIOD]; }

/* ---------- Pré-calculs (distance parcourue → rotation de la bille) ---------- */
const STEP = 1 / 600, N = Math.round(DUR / STEP);
const DIST = new Float64Array(N + 1);
for (let i = 1; i <= N; i++) {
  const a = ballPos((i - 1) * STEP), b = ballPos(i * STEP);
  DIST[i] = DIST[i - 1] + Math.hypot(b[0] - a[0], b[1] - a[1]);

const distAt = (t) => DIST[Math.max(0, Math.min(N, Math.round((((t % DUR) + DUR) % DUR) / STEP)))];

// Position cible de la bille à l'écran selon la phase (haute au début/fin pour la boucle)
const CAM_KEYS = [[0, 380], [1.2, 900], [3.5, 1000], [7.0, 1050], [9.0, 1150], [13.3, 1150], [14.1, 900], [15, 380]];
function camOffset(t) {

  return lerp(a, b, (1 - Math.cos(Math.PI * clamp01((t - t0) / (t1 - t0)))) / 2);

}

function fit(text, size, maxW) {
  ctx.font = `900 ${size}px Cairo`;
  const w = ctx.measureText(text).width;
  return w > maxW ? size * maxW / w : size;
}
// Apparition sans fondu : échelle + glissement avec snap
function text(tc, at, str, x, y, size, color, maxW = SAFE.right - SAFE.left - 20) {
  if (tc < at) return;
  const e = snapE(seg(tc, at, at + 0.26));
  const s = fit(str, size, maxW);
  ctx.save();
  ctx.translate(x, y + lerp(30, 0, e));
  ctx.scale(lerp(0.55, 1, e), lerp(0.55, 1, e));
  ctx.font = `900 ${s}px Cairo`;
  ctx.fillStyle = color;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.direction = "rtl";
  ctx.fillText(str, 0, 0);
  ctx.restore();
}

/* ---------- Rails ---------- */
function rail(points, w = 10) {
  ctx.beginPath();
  points.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])));
  ctx.strokeStyle = CHAR; ctx.lineWidth = w; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.stroke();
}
// Rail sous un segment : on décale chaque point du rayon de la bille, côté « bas » de la tangente
function railUnder(si, from = 0, to = 1, n = 60, side = 1) {
  const s = SEGS[si], pts = [];
  for (let i = 0; i <= n; i++) {
    const u = lerp(from, to, i / n), p = s[3](u), q = s[3](Math.min(1, u + 0.002)), r = s[3](Math.max(0, u - 0.002));
    let tx = q[0] - r[0], ty = q[1] - r[1]; const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
    let nx = -ty, ny = tx; if (ny * side < 0) { nx = -nx; ny = -ny; }
    pts.push([p[0] + nx * (BR + 6), p[1] + ny * (BR + 6)]);
  }
  rail(pts);
}
function railArc(cx, cy, r, a0, a1) {
  ctx.beginPath(); ctx.arc(cx, cy, r + BR + 6, (a0 * Math.PI) / 180, (a1 * Math.PI) / 180, a1 < a0);
  ctx.strokeStyle = CHAR; ctx.lineWidth = 10; ctx.lineCap = "round"; ctx.stroke();
}

/* =====================================================================
   DESSIN D'UNE COPIE DU MONDE (tc = temps local de cette copie)
   ===================================================================== */
function drawWorld(tc, off) {
  ctx.save();
  ctx.translate(0, off);

  // Bande rouge : flash instantané quand la bille tombe dans la poche
  if (tc >= 11.0) { ctx.fillStyle = RED; ctx.fillRect(0, 3050, W, 5320 - 3050); }

  /* --- Mesure 1 : rampes --- */
  railUnder(1); railArc(840, S1END + 239, 85, -90, 90); railUnder(3);
  railArc(230, S1END + 589, 85, -90, -270); railUnder(5); railUnder(6, 0, 1, 80, 1);
  text(tc, 0.25, "الفيديو هذا", 300, S1END - 120, 92, CHAR);
  text(tc, 1.10, "ما عملتوش أنا", 430, S1END + 200, 88, CHAR);
  text(tc, 1.93, "ولا حتى كلمة", 400, S1END + 920, 84, CHAR);
  text(tc, 2.10, "وحدة بيدي", 400, S1END + 1010, 84, RED);

  /* --- Mesure 2 : spirale, volets, badge --- */
  { // rail de la spirale (extérieur)
    const pts = [];
    for (let i = 0; i <= 240; i++) { const u = i / 240, k = 0.3 * u + 0.7 * u * u, r = lerp(160, 110, u), a = ((90 - 720 * k) * Math.PI) / 180; pts.push([300 + (r + BR + 6) * Math.cos(a), TRACK_Y - r + (r + BR + 6) * Math.sin(a)]); }
    rail(pts, 8);
  }
  rail([[300, TRACK_Y + BR + 6], [885, TRACK_Y + BR + 6]]);
  railUnder(9, 0, 1, 30, 1);
  FLAPS.forEach((f, i) => {
    const hinge = TRACK_Y + BR + 6 - 175;
    const k = tc >= f.hit ? outExpo(seg(tc, f.hit, f.hit + 0.35)) : 0;
    const swing = -115 * k + 8 * Math.sin((tc - f.hit) * 9) * Math.exp(-Math.max(0, tc - f.hit) * 3) * (k > 0 ? 1 : 0);
    ctx.save(); ctx.translate(f.x + BR + 4, hinge); ctx.rotate((swing * Math.PI) / 180);
    ctx.fillStyle = i % 2 ? CHAR : RED; ctx.fillRect(-11, 0, 22, 170);
    ctx.restore();
    ctx.beginPath(); ctx.arc(f.x + BR + 4, hinge, 7, 0, Math.PI * 2); ctx.fillStyle = CHAR; ctx.fill();
    text(tc, f.hit, f.word, i % 2 ? 360 : 690, 2602 + Math.floor(i / 2) * 64, 48, i === 3 ? RED : CHAR);
  });
  // Badge Claude : la bille le traverse
  if (claude.complete && claude.naturalWidth) {
    const pass = tc >= BADGE.pass ? Math.exp(-(tc - BADGE.pass) * 6) : 0;
    const s = BADGE.s * (1 + 0.18 * pass);
    ctx.save(); ctx.translate(BADGE.x, BADGE.y); ctx.rotate(pass * 0.35);
    ctx.drawImage(claude, -s / 2, -s / 2, s, s); ctx.restore();
  }
  text(tc, 6.85, "كلها خدمها Claude", 615, 2955, 82, CHAR, 620);
  text(tc, 7.10, "أنا عطيتو مودال وكتبت باش يعمل كيفو", 615, 3045, 50, CHAR, 620);
  railUnder(11, 0, 1, 60, -1);

  /* --- Mesure 3 : engrenages et tampons --- */
  const ga = gearAngle(tc);
  drawGear(GEAR.x, GEAR.y, GEAR.r, 18, ga);
  drawGear(GEAR.x - 330, GEAR.y + 150, 82, 7, -ga * (GEAR.r / 82) + 12);
  const pads = [1, 3, 5];
  pads.forEach((k, i) => {
    const a = ((GEAR_START + GEAR_STEP * (k + 1)) * Math.PI) / 180;
    const at = GEAR_T0 + k * BEAT + 0.22;
    const press = tc >= at ? Math.exp(-(tc - at) * 10) : 0;
    const R = GEAR.ride + BR + 22 - 10 * press;
    ctx.save(); ctx.translate(GEAR.x + R * Math.cos(a), GEAR.y + R * Math.sin(a)); ctx.rotate(a + Math.PI / 2);
    ctx.fillStyle = tc >= at ? RED : CHAR; ctx.fillRect(-34, -9, 68, 18); ctx.restore();
  });
  text(tc, GEAR_T0, "من فكرة للتصميم", 615, 3220, 78, RED, 620);
  text(tc, GEAR_T0 + 1 * BEAT + 0.22, "1. شنوة تحب تعمل", 615, 3310, 60, CHAR, 620);
  text(tc, GEAR_T0 + 3 * BEAT + 0.22, "2. توصف الفكرة بالتفصيل", 615, 3395, 60, CHAR, 620);
  text(tc, GEAR_T0 + 3 * BEAT + 0.36, "prompt : texte · plans · transitions · son", 615, 3455, 36, RED, 620);
  text(tc, GEAR_T0 + 5 * BEAT + 0.22, "3. Rendu مع Claude", 615, 3535, 60, CHAR, 620);

  /* --- Mesure 4 : poche, appel à l'action, logo --- */
  { // poche
    const hit = tc >= 11.0 ? Math.exp(-(tc - 11.0) * 8) : 0;
    ctx.save(); ctx.translate(POCKET.x, POCKET.y + BR + 8 + 10 * hit);
    ctx.beginPath(); ctx.ellipse(0, 0, 96, 30, 0, 0, Math.PI); ctx.strokeStyle = tc >= 11 ? BEIGE : CHAR; ctx.lineWidth = 10; ctx.stroke();
    ctx.restore();
  }
  text(tc, 11.15, "تحب تجرب ؟", CX, 4480, 96, BEIGE);
  text(tc, 11.62, "كوبي lien الـ vidéo هذا وقلو : اعمل كيفو", CX, 4575, 52, WHITE);
  text(tc, 12.10, "خوذ المودال وبدّل الـ text اللي تحبو و les couleurs", CX, 4650, 52, WHITE);
  if (logo.complete && logo.naturalWidth) ctx.drawImage(logo, CX - LOGO.w / 2, LOGO.top, LOGO.w, LOGO.h);

  ctx.restore();
}
function drawGear(x, y, r, teeth, deg) {
  ctx.save(); ctx.translate(x, y); ctx.rotate((deg * Math.PI) / 180);
  ctx.beginPath();
  for (let i = 0; i < teeth * 2; i++) {
    const a0 = (i / (teeth * 2)) * Math.PI * 2, a1 = ((i + 1) / (teeth * 2)) * Math.PI * 2, rr = i % 2 ? r : r + r * 0.09;
    ctx.arc(0, 0, rr, a0, a1);
  }
  ctx.closePath(); ctx.fillStyle = CHAR; ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0, r * 0.72, 0, Math.PI * 2); ctx.fillStyle = BEIGE; ctx.fill();
  ctx.strokeStyle = CHAR; ctx.lineWidth = r * 0.07;
  for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(r * 0.72 * Math.cos((i * Math.PI) / 2), r * 0.72 * Math.sin((i * Math.PI) / 2)); ctx.stroke(); }
  ctx.beginPath(); ctx.arc(0, 0, r * 0.14, 0, Math.PI * 2); ctx.fillStyle = RED; ctx.fill();
  ctx.restore();
}

/* =====================================================================
   RENDU D'UNE IMAGE
   ===================================================================== */
function render(t) {
  t = ((t % DUR) + DUR) % DUR;
  const cam = camY(t);
  ctx.fillStyle = BEIGE; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(0, -cam);
  for (const k of [-1, 0, 1]) drawWorld(t - k * DUR, k * PERIOD);
  // La bille
  const [bx, by] = ballPos(t);
  const asDot = t >= 14.0 && t < 14.1;
  const r = asDot ? lerp(BR, DOT.r, snapE(seg(t, 14.0, 14.06))) : t >= 14.1 ? lerp(DOT.r, BR, snapE(seg(t, 14.1, 14.35))) : BR;
  ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI * 2); ctx.fillStyle = asDot ? BEIGE : CHAR; ctx.fill();
  if (!asDot) { // repère de rotation (roulement)
    const rot = distAt(t) / BR;
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + r * 0.75 * Math.cos(rot), by + r * 0.75 * Math.sin(rot));
    ctx.strokeStyle = WHITE; ctx.lineWidth = 5; ctx.lineCap = "round"; ctx.stroke();
  }
  ctx.restore();
}

/* =====================================================================
   AUDIO — synthèse procédurale hors ligne → WAV
   ===================================================================== */
async function renderAudioWav() {
  const SR = 48000, ac = new OfflineAudioContext(2, DUR * SR, SR);
  const master = ac.createGain(); master.gain.value = 0.6;
  const lim = ac.createDynamicsCompressor(); lim.threshold.value = -4; lim.knee.value = 0; lim.ratio.value = 20; lim.attack.value = 0.001; lim.release.value = 0.05;
  const ceil = ac.createGain(); ceil.gain.value = 0.88;
  master.connect(lim).connect(ceil).connect(ac.destination);
  const rnd = (n) => { const x = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };
  const noise = ac.createBuffer(1, SR * 2, SR); { const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = rnd(i) * 2 - 1; }
  const env = (g, t, a, peak, d) => { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); };
  function click(t, f = 3500, gain = 0.5, d = 0.03) {
    const s = ac.createBufferSource(); s.buffer = noise; const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = f; bp.Q.value = 3;
    const g = ac.createGain(); env(g, t, 0.001, gain, d); s.connect(bp).connect(g).connect(master); s.start(t, rnd(t) * 1.5); s.stop(t + d + 0.05);
  }
  function thud(t, f = 140, gain = 0.8, d = 0.18) {
    const o = ac.createOscillator(); o.frequency.setValueAtTime(f * 2, t); o.frequency.exponentialRampToValueAtTime(f * 0.5, t + d);
    const g = ac.createGain(); env(g, t, 0.002, gain, d); o.connect(g).connect(master); o.start(t); o.stop(t + d + 0.05);
    click(t, 1800, gain * 0.5, 0.025);
  }
  function tone(t, f, gain, d, type = "sine") {
    const o = ac.createOscillator(); o.type = type; o.frequency.value = f; const g = ac.createGain(); env(g, t, 0.003, gain, d); o.connect(g).connect(master); o.start(t); o.stop(t + d + 0.05);
  }
  // Roulement : bruit filtré dont la hauteur et le volume suivent la vitesse de la bille
  {
    const src = ac.createBufferSource(); src.buffer = noise; src.loop = true;
    const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 4;
    const g = ac.createGain();
    const n = DUR * 100, fr = new Float32Array(n), gv = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const t = i / 100, a = ballPos(t), b = ballPos(t + 0.01), v = Math.hypot(b[0] - a[0], b[1] - a[1]) * 100;
      const contact = segAt(t)[2];
      fr[i] = 180 + Math.min(v, 2500) * 0.9;
      gv[i] = contact ? Math.min(0.35, 0.02 + v / 5000) : 0.0001;
    }
    bp.frequency.setValueCurveAtTime(fr, 0, DUR - 0.01); g.gain.setValueCurveAtTime(gv, 0, DUR - 0.01);
    src.connect(bp).connect(g).connect(master); src.start(0); src.stop(DUR);
  }
  // Pulsation discrète sur chaque temps (126 BPM)
  for (let b = 0; b * BEAT < DUR; b++) click(b * BEAT, 6000, 0.12, 0.02);
  // Contacts avec les rails
  [0.25, 0.85, 1.10, 1.68, 1.93, 2.50, 3.50, 4.40, 6.30, 7.00].forEach((t) => { click(t, 2600, 0.55, 0.04); thud(t, 120, 0.35, 0.12); });
  // Volets (dominos) : impact mécanique
  FLAPS.forEach((f) => { thud(f.hit, 100, 0.9, 0.22); click(f.hit + 0.02, 4200, 0.6, 0.03); });
  // Tremplin + passage dans le badge
  tone(6.55, 180, 0.4, 0.25, "triangle"); click(6.55, 1500, 0.6, 0.05);
  tone(BADGE.pass, 1318.5, 0.25, 0.5); tone(BADGE.pass + 0.06, 1975.5, 0.18, 0.6);
  // Engrenage : verrouillage, cliquet à chaque cran, tampons
  thud(7.55, 90, 0.7, 0.2);
  for (let k = 0; k < 7; k++) { const t = GEAR_T0 + k * BEAT; click(t, 3000, 0.7, 0.02); click(t + 0.21, 2200, 0.5, 0.02); }
  [1, 3, 5].forEach((k) => thud(GEAR_T0 + k * BEAT + 0.22, 160, 0.9, 0.16));
  // Poche : sub-bass lourd
  {
    const t = 11.0, o = ac.createOscillator(); o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(30, t + 1.2);
    const ws = ac.createWaveShaper(), c = new Float32Array(1024); for (let i = 0; i < 1024; i++) { const x = i / 511.5 - 1; c[i] = Math.tanh(2.5 * x); } ws.curve = c;
    const g = ac.createGain(); env(g, t, 0.004, 1.0, 1.4); o.connect(ws).connect(g).connect(master); o.start(t); o.stop(t + 1.5);
    click(t, 900, 0.8, 0.12);
  }
  // Appel à l'action, logo
  [11.15, 11.62, 12.10].forEach((t) => click(t, 5000, 0.3, 0.02));
  tone(14.0, 1046.5, 0.25, 0.4); tone(14.0, 1568, 0.15, 0.5); click(14.0, 3000, 0.5, 0.02);

  const buf = await ac.startRendering();
  const n = buf.length, out = new DataView(new ArrayBuffer(44 + n * 4));
  const wr = (o, s) => { for (let i = 0; i < s.length; i++) out.setUint8(o + i, s.charCodeAt(i)); };
  wr(0, "RIFF"); out.setUint32(4, 36 + n * 4, true); wr(8, "WAVE"); wr(12, "fmt "); out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 2, true);
  out.setUint32(24, SR, true); out.setUint32(28, SR * 4, true); out.setUint16(32, 4, true); out.setUint16(34, 16, true); wr(36, "data"); out.setUint32(40, n * 4, true);
  const L = buf.getChannelData(0), R = buf.getChannelData(1);
  for (let i = 0; i < n; i++) { out.setInt16(44 + i * 4, Math.max(-1, Math.min(1, L[i])) * 32767, true); out.setInt16(46 + i * 4, Math.max(-1, Math.min(1, R[i])) * 32767, true); }
  let bin = ""; const bytes = new Uint8Array(out.buffer);
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

window.DURATION = DUR;
window.seek = (t) => render(t);
window.renderAudioWav = renderAudioWav;
window.debug = (t) => { const p = ballPos(t), c = camY(t); return { x: p[0], y: p[1] - c, cam: c, period: PERIOD }; };
window.ready = Promise.all([
  document.fonts.load("900 80px Cairo", "ابت"), document.fonts.load("900 80px Cairo", "Text"),
  new Promise((r) => (logo.complete ? r() : (logo.onload = r))),
  new Promise((r) => (claude.complete ? r() : (claude.onload = r))),
]).then(() => { render(0); return true; });
</script>
